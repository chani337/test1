name: Deploy mood project

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH key
        run: |
          echo "${{ secrets.SSH_KEY }}" | base64 -d > ${{ github.workspace }}/deploy_key
          chmod 644 ${{ github.workspace }}/deploy_key

      - name: 1) Redeploy backend (Private 서버, Public 서버 경유)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRIVATE_HOST }}
          username: ${{ secrets.SSH_USER }}
          key_path: ${{ github.workspace }}/deploy_key
          proxy_host: ${{ secrets.PUBLIC_HOST }}
          proxy_username: ${{ secrets.SSH_USER }}
          proxy_key_path: ${{ github.workspace }}/deploy_key
          script: |
            cd ~/cloudpj
            git pull
            docker compose -f docker-compose.local.yml up -d --build backend

      - name: 2) Redeploy frontend (Public 서버)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PUBLIC_HOST }}
          username: ${{ secrets.SSH_USER }}
          key_path: ${{ github.workspace }}/deploy_key
          script: |
            cd ~/cloudpj
            git pull
            docker rm -f mood-frontend
            docker build -t mood-frontend ./frontend
            docker run -d \
              -p 80:80 -p 443:443 \
              -e DOMAIN=${{ secrets.DOMAIN }} \
              -e BACKEND_HOST=${{ secrets.BACKEND_HOST }} \
              -v /etc/letsencrypt:/etc/letsencrypt:ro \
              --restart unless-stopped \
              --name mood-frontend \
              mood-frontend
